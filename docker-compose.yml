services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vantage
      POSTGRES_USER: vantage
      POSTGRES_PASSWORD: vantage
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vantage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantage -d vantage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vantage-postgres:
